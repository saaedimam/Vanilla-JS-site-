name: Lint
on: [push, pull_request]
jobs:
  superlinter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super Linter
        uses: github/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          FILTER_REGEX_EXCLUDE: "attached_assets/.*|assets/.*"
